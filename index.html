  b.type="button";b.className="track";b.setAttribute("role","option");b.textContent=song.title;
  b.addEventListener("click",()=>playTrack(i,true));
  frag.appendChild(b);
 });
 list.replaceChildren(frag);
}
function highlight(){
 list.querySelectorAll(".track").forEach((el,i)=>{
  const active=i===playingIndex;el.classList.toggle("active",active);el.setAttribute("aria-selected",String(active));
 });
 const active=list.querySelector(".track.active");if(active)active.scrollIntoView({block:"nearest"});
}
function mediaInfo(song){
 if(!("mediaSession" in navigator))return;
 try{
  navigator.mediaSession.metadata=new MediaMetadata({title:song.title,artist:"GT-GELM",album:"GT-GELM MUSIC"});
  navigator.mediaSession.setActionHandler("play",resumePlayback);
  navigator.mediaSession.setActionHandler("pause",pausePlayback);
  navigator.mediaSession.setActionHandler("nexttrack",nextTrack);
  navigator.mediaSession.setActionHandler("previoustrack",previousTrack);
 }catch(e){}
}
function waitUntilPlayable(token){
 return new Promise((resolve,reject)=>{
  if(audio.readyState>=2){resolve();return;}
  let settled=false;
  const finish=(fn,value)=>{if(settled)return;settled=true;clearTimeout(timer);audio.removeEventListener("canplay",onReady);audio.removeEventListener("error",onError);fn(value);};
  const onReady=()=>finish(resolve);
  const onError=()=>finish(reject,new Error("Audio source error"));
  const timer=setTimeout(()=>finish(reject,new Error("Audio load timeout")),12000);
  audio.addEventListener("canplay",onReady,{once:true});
  audio.addEventListener("error",onError,{once:true});
  if(token!==generation)finish(reject,new Error("Playback request superseded"));
 });
}
async function playTrack(i,manual=false){
 if(i<0||i>=TRACKS.length)return;
 const token=++generation;
 if(retryTimer){clearTimeout(retryTimer);retryTimer=null;}
 busy=true;playingIndex=i;
 const song=TRACKS[i];
 audio.pause();
 audio.removeAttribute("src");
 audio.load();
 audio.src=song.url;
 audio.load();
 current.textContent=song.title;
 status.textContent="Cargando canción…";
 setPlayState(true);
 highlight();
 mediaInfo(song);
 try{
  await waitUntilPlayable(token);
  if(token!==generation)return;
  await audio.play();
  if(token!==generation)return;
  started=true;
  setPlayState(true);
  status.textContent="Reproduciendo · aleatorio continuo";
  if(manual)makeOrder();
 }catch(err){
  if(token!==generation)return;
  setPlayState(false);
  status.textContent="Esta canción no inició; intentando otra…";
  retryTimer=setTimeout(()=>{if(token===generation)nextTrack();},1200);
 }finally{
  if(token===generation)busy=false;
 }
}
function nextTrack(){
 if(!order.length||orderPos>=order.length-1)makeOrder();
 orderPos++;
 playTrack(order[orderPos],false);
}
function previousTrack(){
 if(!order.length||orderPos<=0){playTrack((playingIndex-1+TRACKS.length)%TRACKS.length,true);return;}
 orderPos--;
 playTrack(order[orderPos],false);
}
function resumePlayback(){
 if(playingIndex<0){makeOrder();nextTrack();return;}
 audio.play().then(()=>{
  started=true;setPlayState(true);status.textContent="Reproduciendo · aleatorio continuo";
 }).catch(()=>{
  setPlayState(false);status.textContent="Toca PLAY para reanudar la música";
 });
}
function pausePlayback(){
 audio.pause();setPlayState(false);status.textContent="En pausa";
}
start.addEventListener("click",()=>{
 if(!started&&playingIndex<0){makeOrder();nextTrack();return;}
 if(audio.paused)resumePlayback();else pausePlayback();
});
audio.addEventListener("ended",()=>{
 // Keep playback active: queue the next track and explicitly start it.
 setPlayState(true);
 status.textContent="Preparando la siguiente canción…";
 nextTrack();
});
audio.addEventListener("error",()=>{
 if(!busy&&playingIndex>=0){
  setPlayState(false);
  status.textContent="Audio no disponible; pasando a otra canción…";
  if(retryTimer)clearTimeout(retryTimer);
  retryTimer=setTimeout(nextTrack,900);
 }
});
audio.addEventListener("playing",()=>{
 setPlayState(true);
 status.textContent="Reproduciendo · aleatorio continuo";
});
audio.addEventListener("pause",()=>{
 if(!audio.ended&&started)setPlayState(false);
});
audio.addEventListener("waiting",()=>status.textContent="Cargando audio…");

render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
